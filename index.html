<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foamwright</title>
<meta name="description" content="Design foam postural support devices: dimension foam blocks, place mounting brackets and specify covers, then produce a cut list and specification sheet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand" aria-label="Foamwright">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 22 L16 28 L28 22 L28 12 L16 18 L4 12 Z" fill="var(--foam)" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 12 L16 6 L28 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 9.5 Q16 15 23 9.5" fill="none" stroke="var(--dim)" stroke-width="1.6"/></svg>
    <span>Foamwright</span>
  </div>
  <label class="sr-only" for="project-name">Device name</label>
  <input id="project-name" class="project-name" type="text" autocomplete="off">
  <nav class="menu" aria-label="File">
    <button type="button" class="btn" id="btn-new">New</button>
    <button type="button" class="btn" id="btn-open">Open</button>
    <button type="button" class="btn" id="btn-save" title="Save project file (Ctrl+S)">Save</button>
    <label class="sr-only" for="export-menu">Export</label>
    <select id="export-menu" class="btn select-btn">
      <option value="">Export…</option>
      <option value="svg">Drawing sheet (SVG)</option>
      <option value="csv">Cut list (CSV)</option>
      <option value="json">Project file (JSON)</option>
    </select>
    <button type="button" class="btn primary" id="btn-spec">Specification</button>
  </nav>
  <div class="topbar-right">
    <button type="button" class="icon-btn" id="btn-undo" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
    <button type="button" class="icon-btn" id="btn-redo" title="Redo (Ctrl+Y)" aria-label="Redo">↷</button>
    <div class="segs" role="group" aria-label="Units">
      <button type="button" class="seg" data-units="mm">mm</button>
      <button type="button" class="seg" data-units="in">in</button>
    </div>
  </div>
</header>

<main class="workspace">
  <aside class="panel left" aria-label="Parts and checks">
    <section class="panel-section">
      <div class="section-head">
        <h2>Parts</h2>
        <label class="sr-only" for="add-part">Add part</label>
        <select id="add-part" class="btn small primary select-btn"></select>
      </div>
      <div id="parts"></div>
    </section>
    <section class="panel-section">
      <div class="section-head"><h2>Design checks</h2><span id="issue-count" class="count"></span></div>
      <div id="issues"></div>
    </section>
  </aside>

  <section class="stage" aria-label="Drawing views">
    <div class="toolbar" role="toolbar" aria-label="Drawing tools">
      <div class="segs" role="group" aria-label="Tool">
        <button type="button" class="seg" data-tool="select" title="Select and move (V)">Select</button>
        <button type="button" class="seg" data-tool="dim" title="Add a dimension (D)">Dimension</button>
      </div>
      <label class="sr-only" for="dim-mode">Dimension type</label>
      <select id="dim-mode" class="btn small select-btn" hidden>
        <option value="auto">Auto (horizontal / vertical)</option>
        <option value="h">Horizontal</option>
        <option value="v">Vertical</option>
        <option value="a">Aligned</option>
      </select>
      <button type="button" class="btn small" id="btn-clear-dims">Clear dimensions</button>
      <span class="spacer"></span>
      <label class="check small"><input type="checkbox" id="chk-grid" checked><span>Grid</span></label>
      <label class="sr-only" for="colour-mode">Colour parts by</label>
      <select id="colour-mode" class="btn small select-btn">
        <option value="foam">Colour: foam grade</option>
        <option value="cover">Colour: cover</option>
      </select>
      <button type="button" class="btn small" id="btn-fit" title="Zoom all views to fit (F)">Fit all</button>
    </div>
    <div class="views" id="views">
      <div class="vp" id="vp-top"></div>
      <div class="vp" id="vp-iso"></div>
      <div class="vp" id="vp-front"></div>
      <div class="vp" id="vp-right"></div>
    </div>
    <footer class="statusbar" id="status" aria-live="polite"></footer>
  </section>

  <aside class="panel right" id="props" aria-label="Properties"></aside>
</main>

<dialog id="new-dialog" class="dialog" aria-labelledby="new-title">
  <div class="dialog-head">
    <h2 id="new-title">Start a new device</h2>
    <form method="dialog"><button class="icon-btn" aria-label="Close">✕</button></form>
  </div>
  <p class="dialog-sub">Templates use typical adult sizes. Adjust every dimension to the user's measurements.</p>
  <div id="template-list" class="template-list"></div>
</dialog>

<dialog id="spec-dialog" class="dialog spec" aria-label="Specification sheet">
  <div class="dialog-head no-print">
    <h2>Specification sheet</h2>
    <div class="btn-row">
      <button type="button" class="btn primary" id="spec-print">Print or save PDF</button>
      <button type="button" class="icon-btn" id="spec-close" aria-label="Close">✕</button>
    </div>
  </div>
  <div id="spec-body" class="spec-body"></div>
</dialog>

<input type="file" id="file-input" accept=".json,application/json" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
